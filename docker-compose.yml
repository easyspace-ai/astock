# Phase 0 单 service:FastAPI 启动后既跑 API 又托管前端 dist。
# 见 ADR-17 / §8.1。
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BACKEND_EXTRAS: ${BACKEND_EXTRAS:-}
        CODEX_CLI_VERSION: ${CODEX_CLI_VERSION:-0.144.3}
    container_name: TickFlow_Stock_Panel
    ports:
      - "${HOST:-0.0.0.0}:${PORT:-3018}:3018"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      # 强制固定为容器内绝对路径, 防止 .env 里的 DATA_DIR=./data(开发模式用)
      # 被 env_file 原样传入容器后按错误的相对路径解析, 写到未挂载卷的目录,
      # 导致每次 up --build 重建容器都丢数据。environment 优先级高于 env_file,
      # 无论 .env 怎么写这里都以容器路径为准。
      - DATA_DIR=/app/data
      # 将主机 Codex Desktop 的 loopback local-access 端点映射到 Docker host gateway。
      - CODEX_DOCKER_HOST=host.docker.internal
    volumes:
      - ./data:/app/data
      - ./tiers.yaml:/app/tiers.yaml:ro
      # 保留原始 dotenv 值供首次密码初始化读取，避免 Compose 展开密码中的 $VAR。
      - ./.env:/app/.env:ro
      # 复用主机 Codex 登录态；后端只读后复制到单次请求的临时 CODEX_HOME。
      # Windows PowerShell/CMD 下 HOME 常未设置, 可通过 .env 里 CODEX_HOME_HOST 覆盖。
      - ${CODEX_HOME_HOST:-${HOME}/.codex}:/root/.codex:ro
    restart: unless-stopped
    # 盘后管道 15:35 触发, 进程内 AsyncIOScheduler 没有持久化 job store;
    # 因此本服务必须保持单副本。若未来水平扩容为多副本, 必须先把调度改为
    # 外部单例 (分布式锁或独立 worker), 否则每个副本都会跑一遍盘后管道。
    # stop_grace_period 给正在执行的日K写入/校验留出收尾时间, 降低半成品分区。
    stop_grace_period: 120s
    # 只证明进程活着的 /health 不够: /ready 会检查数据目录可写、磁盘水位、
    # 用户库可读与调度器心跳。外部数据源抖动不会让容器反复重启。
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3018/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # 限制 Docker 自身 json 日志膨胀, 避免磁盘写满后应用日志 handler 停用。
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
